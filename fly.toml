# fly.toml app configuration file generated for lubook on 2026-08-12T19:23:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lubook'
primary_region = 'gru'
console_command = '/rails/bin/rails console'

[build]

[deploy]
  release_command = 'bin/rails db:prepare'

[env]
  ACTIVE_STORAGE_SERVICE = 'production_local'
  APP_HOST = 'lubook.fly.dev'
  RAILS_LOG_TO_STDOUT = '1'

[processes]
  app = './bin/rails server -p 3000 -b 0.0.0.0'

[[mounts]]
  source = 'lubook_storage'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
